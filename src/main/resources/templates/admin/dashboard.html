<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="container">
    <h2 class="mb-3">Thống kê</h2>
    <div class="card mb-4">
        <div class="card-body">
            <strong>Tổng doanh thu:</strong>
            <span th:text="${totalRevenue}"></span>
        </div>
    </div>
    <h3>Top 5 sản phẩm bán chạy</h3>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th style="width: 200px;">Ảnh</th>
            <th>Tên</th>
            <th>Số lượng bán</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${topProducts}">
            <td th:text="${item.productId}"></td>
            <td>
                <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="Ảnh" class="img-thumbnail product-thumb">
                <span th:if="${item.imageUrl == null}">-</span>
            </td>
            <td th:text="${item.productName}"></td>
            <td th:text="${item.totalQuantity}"></td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
