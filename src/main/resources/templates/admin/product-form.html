<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="container">
    <h2 class="mb-3">Sản phẩm</h2>
    <div id="uploadError" class="alert alert-danger" th:classappend="${uploadError} ? '' : 'd-none'"
         th:text="${uploadError}"></div>
    <form id="productForm" th:action="@{/admin/products/save}" th:object="${product}" method="post"
          class="card card-body" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <label class="form-label">Tên:</label>
        <input type="text" th:field="*{name}" class="form-control">
        <div class="text-danger small" th:errors="*{name}"></div>

        <label class="form-label mt-3">Mô tả:</label>
        <textarea th:field="*{description}" class="form-control"></textarea>

        <label class="form-label mt-3">Giá:</label>
        <input type="number" step="0.01" th:field="*{price}" class="form-control">
        <div class="text-danger small" th:errors="*{price}"></div>

        <label class="form-label mt-3">Tồn kho:</label>
        <input type="number" th:field="*{stockQuantity}" class="form-control">
        <div class="text-danger small" th:errors="*{stockQuantity}"></div>

        <label class="form-label mt-3">Ảnh sản phẩm:</label>
        <input type="file" name="imageFile" class="form-control" accept="image/*" data-max-size="5242880">
        <div class="form-text">Dung lượng tối đa: 5MB</div>
        <div class="mt-2" th:if="${product.imageUrl}">
            <img th:src="${product.imageUrl}" alt="Ảnh sản phẩm" class="img-thumbnail" style="max-width: 200px;">
        </div>

        <label class="form-label mt-3">Danh mục:</label>
        <select name="categoryId" class="form-select">
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                    th:selected="${product.category != null and product.category.id == cat.id}"></option>
        </select>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/products}">Quay lại</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('productForm');
    const fileInput = form.querySelector('input[name="imageFile"]');
    const errorBox = document.getElementById('uploadError');
    const maxSize = Number(fileInput.dataset.maxSize || 0);

    form.addEventListener('submit', (event) => {
        if (fileInput.files.length === 0 || maxSize === 0) {
            return;
        }
        if (fileInput.files[0].size > maxSize) {
            event.preventDefault();
            errorBox.textContent = 'Ảnh vượt quá dung lượng cho phép (5MB).';
            errorBox.classList.remove('d-none');
            errorBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    });
</script>
</body>
</html>
