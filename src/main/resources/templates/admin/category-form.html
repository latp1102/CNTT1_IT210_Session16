<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Category Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="container">
    <h2 class="mb-3">Danh mục</h2>
    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">
        <label class="form-label">Tên:</label>
        <input type="text" th:field="*{name}" class="form-control">
        <div class="text-danger small" th:errors="*{name}"></div>
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Quay lại</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
