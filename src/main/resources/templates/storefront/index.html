<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Storefront</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="container">
    <h2 class="mb-3">Danh sách sản phẩm</h2>
    <form th:action="@{/}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-md-3">
            <label class="form-label">Tên sản phẩm</label>
            <input type="text" name="name" class="form-control" th:value="${criteria.name}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Giá từ</label>
            <input type="number" step="0.01" name="minPrice" class="form-control" th:value="${criteria.minPrice}">
        </div>
        <div class="col-md-2">
            <label class="form-label">Giá đến</label>
            <input type="number" step="0.01" name="maxPrice" class="form-control" th:value="${criteria.maxPrice}">
        </div>
        <div class="col-md-3">
            <label class="form-label">Danh mục</label>
            <select name="categoryId" class="form-select">
                <option value="">Tất cả danh mục</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                        th:selected="${criteria.categoryId != null and criteria.categoryId == cat.id}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
        </div>
    </form>
    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th style="width: 200px;">Ảnh</th>
            <th>Tên</th>
            <th>Giá</th>
            <th>Tồn kho</th>
            <th>Danh mục</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td>
                <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" alt="Ảnh" class="img-thumbnail product-thumb">
                <span th:if="${product.imageUrl == null}">-</span>
            </td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stockQuantity}"></td>
            <td th:text="${product.category != null ? product.category.name : 'N/A'}"></td>
            <td>
                <form th:action="@{/cart/add}" method="post" class="d-flex gap-2">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <input type="number" name="quantity" value="1" min="1" class="form-control form-control-sm"
                           style="max-width: 80px;">
                    <button type="submit" class="btn btn-sm btn-success">Thêm</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <nav th:if="${totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active' : ''">
                <a class="page-link"
                   th:href="@{/(page=${i},size=8,name=${criteria.name},minPrice=${criteria.minPrice},maxPrice=${criteria.maxPrice},categoryId=${criteria.categoryId})}"
                   th:text="${i}"></a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
