<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="container">
    <h2 class="mb-3">Giỏ hàng</h2>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div th:if="${cart.items.size() == 0}" class="alert alert-info">Giỏ hàng trống.</div>
    <div th:if="${cart.items.size() > 0}">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th style="width: 200px;">Ảnh</th>
                <th>Tên</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Tạm tính</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.items}">
                <td>
                    <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="Ảnh" class="img-thumbnail product-thumb">
                    <span th:if="${item.imageUrl == null}">-</span>
                </td>
                <td th:text="${item.productName}"></td>
                <td th:text="${item.unitPrice}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="productId" th:value="${item.productId}">
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                               class="form-control form-control-sm" style="max-width: 80px;">
                        <button type="submit" class="btn btn-sm btn-outline-primary">Cập nhật</button>
                    </form>
                </td>
                <td th:text="${item.lineTotal}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post" class="d-inline">
                        <input type="hidden" name="productId" th:value="${item.productId}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <strong>Tổng tiền:</strong>
                <span th:text="${cart.totalAmount}"></span>
            </div>
            <a class="btn btn-success" th:href="@{/checkout}">Thanh toán</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
