<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="fragments/header :: navbar"></div>
<div class="container">
    <h2 class="mb-3">Thanh toán</h2>
    <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post" class="card card-body">
        <label class="form-label">Họ tên:</label>
        <input type="text" th:field="*{fullName}" class="form-control">
        <div class="text-danger small" th:errors="*{fullName}"></div>

        <label class="form-label mt-3">Email:</label>
        <input type="email" th:field="*{email}" class="form-control">
        <div class="text-danger small" th:errors="*{email}"></div>

        <label class="form-label mt-3">Số điện thoại:</label>
        <input type="text" th:field="*{phone}" class="form-control">
        <div class="text-danger small" th:errors="*{phone}"></div>

        <label class="form-label mt-3">Địa chỉ:</label>
        <input type="text" th:field="*{address}" class="form-control">
        <div class="text-danger small" th:errors="*{address}"></div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success">Xác nhận đặt hàng</button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
